[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autospan"
version = "0.1.0.post1"
description = "Test automation from hardware to CI"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nidhal Abidi"}]
keywords = ["testing", "test-automation", "hardware", "pytest", "ci", "embedded"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.urls]
Homepage = "https://github.com/nidops/autospan"
Documentation = "https://github.com/nidops/autospan/blob/master/docs/ARCHITECTURE.md"
Source = "https://github.com/nidops/autospan"
Issues = "https://github.com/nidops/autospan/issues"

[project.optional-dependencies]
tui = ["textual>=0.80"]
test = ["pytest>=8,<10"]
dev = [
  "pytest>=8,<10",
  "textual>=0.80",
  "ruff>=0.12",
  "mypy>=1.13",
  "types-PyYAML",
  "build>=1.2",
  "twine>=6.2,<8",
  "packaging>=24",
  "readme-renderer[md]>=44",
]

[project.scripts]
autospan = "autospan.frontends.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autospan*"]
namespaces = false

[tool.setuptools.package-data]
autospan = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "hardware: requires physical hardware",
  "destructive: may alter target state or software",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
